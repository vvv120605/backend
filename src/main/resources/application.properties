spring.application.name=SonidoVivo-backend

# Servidor
server.port=8080

# Base de datos MySQL (se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dsy1104_TeamMusic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway maneja el esquema; Hibernate solo lo valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.web.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

#Heartbeat / health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always