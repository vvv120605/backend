name: CI Backend

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Compilar y ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar los tests
        run: mvn -B test

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t sonidovivo-backend .